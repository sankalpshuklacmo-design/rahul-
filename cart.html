<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basket — Pandey's Real Taste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <div class="container nav">
      <a class="logo" href="index.html">Pandey's <span>Real Taste</span></a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a class="cart-btn" href="cart.html">Basket <b data-cart-count>0</b></a>
    </div>
  </header>

  <section>
    <div class="container">
      <p class="eyebrow">Checkout</p>
      <h2 style="margin-bottom:22px">Your basket</h2>
      <div class="cart-page">
        <div id="cart-list"></div>
        <aside class="summary">
          <h3>Bill</h3>
          <div class="row"><span>Subtotal</span><span id="sum-sub">₹0</span></div>
          <div class="row"><span>Shipping</span><span id="sum-ship">₹0</span></div>
          <div class="row"><strong>Total</strong><strong id="sum-total">₹0</strong></div>
          <p style="font-size:0.9rem;color:var(--muted)">Free shipping on ₹499+. Pay on delivery in this demo.</p>
          <button class="btn checkout" onclick="checkout()">Place order (COD)</button>
        </aside>
      </div>
    </div>
  </section>
  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
