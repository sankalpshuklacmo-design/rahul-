<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Pandey's Real Taste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <div class="container nav">
      <a class="logo" href="index.html">Pandey's <span>Real Taste</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">Our kitchen</a>
      </nav>
      <a class="cart-btn" href="cart.html">Basket <b data-cart-count>0</b></a>
    </div>
  </header>
  <section>
    <div class="container" style="max-width:640px">
      <p class="eyebrow">Talk to us</p>
      <h2>Orders, bulk tins, wedding hampers</h2>
      <p style="margin:14px 0 22px">WhatsApp <strong>+91 98765 43210</strong> or write to <strong>hello@pandeysrealtaste.example</strong>. Replace these with your real number when you go live.</p>
      <form class="filters" onsubmit="event.preventDefault(); toast('Message saved on this demo — wire this to email or WhatsApp.');">
        <label>Name<br><input class="search" required></label>
        <label>Phone / WhatsApp<br><input class="search" required></label>
        <label>Message<br><textarea class="search" rows="4"></textarea></label>
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </section>
  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
